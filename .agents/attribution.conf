# Whether the commits and pull requests of this project may name an agent as
# a co-author or as the tool that generated them.
#
# Format: one setting.
#
#   agent-attribution: <allowed | disabled>
#
# - allowed: agents attribute their work as their clients do, for example
#   Claude Code's 'Co-Authored-By' trailer and its 'Generated with' line.
#   Nothing is checked. A project without this file behaves the same, as
#   every project did before the setting existed.
# - disabled: no commit and no pull request description of a feature may name
#   an agent. AGENTS.md tells the agents so; a Claude session the scripts
#   start gets the matching setting on its command line; finish-feature.sh
#   refuses a commit of the feature with an agent's 'Co-authored-by' trailer,
#   and publish-feature.sh refuses, before the push, such a commit and a
#   description that carries generated attribution text. Co-authors who are
#   people are never rejected, and the history of the base is never checked
#   or rewritten. Codex has no attribution setting and Cursor's can be set
#   only for the user: for them the instructions and the check are what
#   applies, as doctor.sh reports.
#
# The template ships 'disabled': its work is published under the owner's own
# name, with the owner as the Git author. A project that wants its agents
# named changes the line to 'allowed'.

agent-attribution: disabled
