# The risk policy: which paths make a feature Low, Medium, or High risk.
# scripts/check-risk.sh and the workflow scripts read this file, always from
# the base branch, so a feature cannot relax the rules it is classified by.
# .agents/policies/autonomy.md describes what the levels mean.
#
# Format: one '<key>: <value> [<value>...]' per line. Git pathspecs.
#
# - low, medium, high: the path classes. The highest class of any path the
#   feature changed is its path-based minimum. A path that matches two
#   classes gets the higher one.
# - default: the level of a path that no class names.
# - tests: the test files. A removed or changed line of an existing one,
#   where an existing test can be weakened (an assertion, a skip, a
#   threshold, test collection), makes the feature High, and so does a
#   removed test file. A file whose diff only adds lines (a new case, a new
#   helper) keeps the class of its path, and so does a new, standalone test
#   file: an added test weakens nothing. Without this key: tests test.
# - test-fixtures: the shared test libraries (a conftest, fixtures, helpers
#   that many tests load). Any change under them, also an added line or a
#   new file, makes the feature High, since it can change every test.
#   Without this key: tests/lib-fakes.sh.
# - manifests: the dependency and toolchain manifests of the project. A
#   change to an existing one makes the feature High.
#
# Always High, whatever this file says: a changed or removed line in
# scripts/verify.conf or scripts/verify-workflow.conf, a change to an
# existing file under .agents/policies/, .agents/prompts/, or
# .agents/schemas/ (this file among them), a removed or changed line of an
# existing test file, any change to a shared test fixture, a change to an
# existing manifest, and a feature that the independent reviewer classifies
# as a major or breaking change of the architecture. Apart from the test
# fixtures, these escalations read only changed or removed existing lines
# and files, never their content: a file the feature adds never escalates by
# itself, and keeps the class of its path. An agent can raise the level of a
# feature, never lower it.
#
# As shipped, every feature is Medium or High, which is the behaviour of a
# project without this file. Add the classes of your project, for example
# for a web application:
#
#   low: docs :(glob)**/*.md
#   high: src/auth src/permissions db/migrations infra deploy
#   manifests: package.json package-lock.json pyproject.toml uv.lock Dockerfile
#
# What each level requires of the workflow (docs/development.md, "What each
# level requires"), one '<level>: <kind>: <value>' per line:
#
# - '<level>: verification: full' or '<level>: verification: groups <group>...':
#   the checks that run before an intermediate review round of
#   run-feature.sh, the repair and fix rounds between the first review and
#   the review of the complete feature. The groups are those of
#   scripts/verify.conf ('<name> [<group>]: <command>'). A partial run is
#   never a verification: it records nothing, the reviewer is told that the
#   content is partially checked, and the completion record cannot cite it.
#   The full verification runs before the commit, whatever stands here.
# - '<level>: review: full' or '<level>: review: delta': whether a later
#   round may review only the changes since the round before, when it can
#   build on that round. 'low: review: none' lets a Low feature be committed
#   without a review; the commit and the pull request say so, and the merge
#   approval gate then needs the owner. 'none' is refused for medium and high.
# - '<level>: triage: full' or '<level>: triage: light': how the findings of
#   a review round are triaged. With 'light' the triage agent is told that
#   the policy prefers to defer or accept a suggestion or a minor finding
#   over a fix session, and the triage records the mode; a round whose
#   findings are all suggestions or minor and all deferred or accepted ends
#   the review loop without a fix session, as a round without FIX_NOW does
#   in every mode. Critical and major findings are FIX_NOW in every mode.
#   'light' is refused for high: a high-risk feature keeps the full triage.
#
# The strictest value of the base refs counts. A level without a line gets
# the full verification, delta reviews, and the full triage, which is what
# the workflow did before it knew the levels; the template therefore writes
# no requirement line.
#
# - profile: light | standard: the workflow profile (docs/development.md,
#   "Workflow profiles"), a named preset of this file in scripts/lib/risk.sh.
#   It supplies the lines of the keys this file does not write; a line
#   written here always wins. 'standard' is the policy the template ships.
#   'light' adds a low class for the documentation and process files (docs
#   outside the ADRs and the planning documents, .agents/plans, handoffs,
#   summaries, and the top-level Markdown files but AGENTS.md), and
#   'low: review: none', 'low: triage: light', 'medium: triage: light'. No
#   profile changes the high class, the escalations, or what high requires,
#   and a high-risk feature gets the full workflow under every profile.
#   Without the key nothing is added: the lines of this file are the policy.
#   To move from light to standard, change this one line.

default: medium
high: docs/decisions .github/workflows .github/CODEOWNERS .agents/policies .agents/prompts/reviewer.md .agents/schemas .agents/agents.conf scripts/check-guardrails.sh scripts/lib/guardrails.sh scripts/check-risk.sh scripts/lib/risk.sh scripts/lib/agent.sh scripts/lib/review-data.sh scripts/lib/review-run.sh scripts/lib/fingerprint.sh scripts/review-feature.sh scripts/finish-feature.sh scripts/publish-feature.sh scripts/run-feature.sh scripts/verify.conf scripts/verify-workflow.conf
tests: tests test
test-fixtures: tests/lib-fakes.sh
