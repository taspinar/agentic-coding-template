# Where this project's workflow comes from, for ./scripts/sync-template.sh.
#
# Format: one '<key>: <value>' per line.
#
# - repository: the template, as a URL or a local path.
# - paths: the files that belong to the template, as Git pathspecs separated
#   by spaces. Only these are ever taken over; everything else is the
#   project's own. A sync uses the template's list. To keep a listed file as
#   the project's own, add ':(exclude)<path>' here: the exclusions of the
#   project always apply.
# - commit: the template commit this project has. sync-template.sh writes it
#   after every sync. Without it, the first sync finds the template commit
#   that matches the project best.

repository: https://github.com/taspinar/agentic-coding-template

paths: AGENTS.md .gitignore .agents/agents.conf .agents/template.conf .agents/policies .agents/prompts .agents/schemas .github/ISSUE_TEMPLATE .github/PULL_REQUEST_TEMPLATE.md .github/workflows scripts tests/lib-fakes.sh :(glob)tests/*-test.sh docs/agentic-workflow.md docs/development.md docs/evaluation.md docs/example.md docs/project-map.md docs/repository-setup.md docs/workflow.md
