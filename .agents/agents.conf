# Agent provider and model per workflow role.
#
# Format: one role per line.
#
#   <role>: <provider> <model>
#
# - <provider> is 'codex' or 'claude'.
# - <model> is passed unchanged to the provider CLI. Use a model your account
#   supports; a rejected model fails the run and is never replaced by another.
# - The --agent and --model options of a workflow script override this file
#   for one run.
#
# A role of a feature (implementer, reviewer, triage, triage-implementer) may
# also have a line per risk level of the feature (.agents/policies/risk.conf):
#
#   <role>@<level>: <provider> <model>
#
# - <level> is 'low', 'medium', or 'high'. When a script starts the role it
#   takes, in this order: --agent and --model; the line of the role and the
#   effective level of the feature at that moment, never below a level an
#   earlier session of the feature ran at; the plain line of the role.
#   Without such a line the plain line applies, as before the levels existed.
#   See docs/development.md, "Configuring agents".
#
# Use a different provider for a reviewing role than for the role whose work
# it reviews, also for the pair that a level line resolves to.
#
# The lines below are the template's choices, from the features that built
# it: a feature that changes the workflow and its gate (a high-risk feature)
# converged in one or two rounds with the strongest model and in many with a
# weaker one, while the other features did not need it. The writing roles of
# a feature are therefore Claude at every level, a stronger model at high;
# the reviewer is Codex at every level, so the pair differs at every level
# without a line of its own; the triage, Claude, judges the review of Codex.
# A project changes the models, the levels, and the providers as it sees
# fit: Codex remains supported as implementer and triage-implementer, inside
# its sandbox, for a project that configures it.

# start-planning.sh
project-grill: claude fable
project-planner: claude fable
planning-reviewer: codex gpt-6-astra

# start-feature.sh, review-feature.sh
implementer: claude opus
implementer@high: claude fable
reviewer: codex gpt-6-luna

# triage-review.sh, apply-triage.sh
triage: claude sonnet
triage-implementer: claude opus
triage-implementer@high: claude fable

# analyze-runs.sh: reads the run records; never changes a file
analyst: claude fable
