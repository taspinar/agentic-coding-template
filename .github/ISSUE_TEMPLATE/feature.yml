name: Feature
about: Define a scoped feature for implementation
labels: [feature]
body:
  - type: textarea
    attributes:
      label: Goal
      description: What outcome should this feature deliver?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Constraints / context
      description: Relevant architecture, dependencies, or boundaries.
