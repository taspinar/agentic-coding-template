name: Documentation

# Publishes the documentation site of the template: builds the Astro project
# in documentation/ and publishes its output, nothing else of the repository.
# The site address and base path come from the Pages configuration of the
# repository, so the same build serves the project path and a custom domain.
#
# This workflow belongs to the template itself. It is not in the paths that
# sync-template.sh hands to a project, and it runs only in a repository that
# sets the variable PUBLISH_DOCUMENTATION to "true", so a project created
# from the template does not publish the template's documentation.

on:
  push:
    branches: [main]
    paths:
      - documentation/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLISH_DOCUMENTATION == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always the tip of the default branch, not the commit that started the
      # run: runs wait for each other and can finish out of order, and the
      # last one to finish must not publish an older version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: documentation/.nvmrc
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install the dependencies
        working-directory: documentation
        run: npm ci --no-audit --no-fund
      - name: Install the browser for documentation checks
        working-directory: documentation
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the site against the repository
        working-directory: documentation
        run: ./check.sh --build
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        working-directory: documentation
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Check the build that is published
        working-directory: documentation
        run: ./check.sh dist "${{ steps.pages.outputs.base_path }}/" "${{ steps.pages.outputs.origin }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/dist
      - id: deployment
        uses: actions/deploy-pages@v4
