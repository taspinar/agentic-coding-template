# Required verification checks for ./scripts/verify.sh.
#
# Format: one check per line.
#
#   <name>: <command>
#
# - <name> uses lowercase letters, digits, and '-', and must be unique.
# - <command> runs with 'bash -eo pipefail' from the repository root, so a
#   failing step in a pipeline or command sequence fails the check.
# - The first word of <command> is the required tool. Verification fails when
#   it is missing or not executable, and when the command exits non-zero.
# - Every listed check is required. Remove a check instead of making it optional.
# - A check may name a group in square brackets after its name:
#   '<name> [<group>]: <command>'. './scripts/verify.sh --only <group>' runs
#   the checks of that group, for a CI that spreads the same checks over
#   parallel jobs. A check without a group belongs to the group 'default';
#   such a CI has to run that group too. A partial run verifies nothing:
#   only a run without --only does.
#
# - One line 'budget-seconds: <n>' may set a target for the duration of all
#   checks of this file in one run, in seconds. Over it, the summary shows
#   BUDGET with the total, the target, and the five slowest checks: a
#   measurement, not a failure (docs/development.md, "Budgets"). Without the
#   line nothing is compared; the duration of every check is recorded either
#   way.
#
# The self-tests of the workflow scripts are not listed here but in
# scripts/verify-workflow.conf; they run only when a workflow file changed.
#
# Replace the template checks below with the checks of your project's stack,
# for example:
#
#   lint: ruff check .
#   tests: pytest
#
#   lint: npm run lint
#   type-check: npm run type-check
#   tests: npm test
#   build: npm run build

template-structure: test -f AGENTS.md -a -f docs/architecture.md -a -f .agents/prompts/reviewer.md
shell-syntax: for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
docs-scripts: for script in scripts/*.sh scripts/lib/*.sh; do grep -Fq "$(basename "$script")" docs/project-map.md || { echo "docs/project-map.md does not mention $script"; exit 1; }; done
# The Markdown files name only files that exist. The paths after --later are
# what a project creates: its description, the approval of its planning, a
# change request, and the optional setup script of a worktree.
docs-references: ./scripts/check-docs.sh --later docs/PROJECT_DESCRIPTION.md docs/PLANNING_APPROVAL.md docs/changes scripts/worktree-setup.sh
# The documentation site is the template's own: a project does not have it.
documentation: test ! -d documentation || { cd documentation && npm ci --no-audit --no-fund --loglevel=error && ./check-test.sh && ./check.sh --build; }
