# Required verification checks for ./scripts/verify.sh.
#
# Format: one check per line.
#
#   <name>: <command>
#
# - <name> uses lowercase letters, digits, and '-', and must be unique.
# - <command> runs with 'bash -eo pipefail' from the repository root, so a
#   failing step in a pipeline or command sequence fails the check.
# - The first word of <command> is the required tool. Verification fails when
#   it is missing or not executable, and when the command exits non-zero.
# - Every listed check is required. Remove a check instead of making it optional.
#
# Replace the template checks below with the checks of your project's stack,
# for example:
#
#   lint: ruff check .
#   tests: pytest
#
#   lint: npm run lint
#   type-check: npm run type-check
#   tests: npm test
#   build: npm run build

template-structure: test -f AGENTS.md -a -f docs/architecture.md -a -f .agents/prompts/reviewer.md
shell-syntax: for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
verify: ./tests/verify-test.sh
doctor: ./tests/doctor-test.sh
agent: ./tests/agent-test.sh
fingerprint: ./tests/fingerprint-test.sh
create-feature-issue: ./tests/create-feature-issue-test.sh
review-feature: ./tests/review-feature-test.sh
review-planning: ./tests/review-planning-test.sh
revise-planning: ./tests/revise-planning-test.sh
finish-planning: ./tests/finish-planning-test.sh
triage-review: ./tests/triage-review-test.sh
apply-triage: ./tests/apply-triage-test.sh
start-planning: ./tests/start-planning-test.sh
