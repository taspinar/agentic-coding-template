# Self-tests of the workflow scripts, run by ./scripts/verify.sh.
#
# These checks test the workflow itself (scripts/, the agent contracts, the
# schemas, and the ignore rules for review and triage files), not the project. They run only when a file listed under
# 'paths:' differs from the base branch (origin/main, or main), counting
# uncommitted and untracked files, or when that cannot be determined.
# './scripts/verify.sh --all' always runs them; CI uses it.
#
# Format: as scripts/verify.conf, one '<name>: <command>' per line, plus the
# reserved entry 'paths:' with the Git pathspecs of the workflow files,
# separated by spaces. Narrow 'paths:' when the project keeps its own files in
# one of these places. Delete this file when the project removes the workflow
# scripts.

paths: scripts .agents/prompts .agents/schemas .agents/agents.conf .gitignore :(glob)tests/*-test.sh tests/lib-fakes.sh

verify: ./tests/verify-test.sh
doctor: ./tests/doctor-test.sh
agent: ./tests/agent-test.sh
fingerprint: ./tests/fingerprint-test.sh
create-feature-issue: ./tests/create-feature-issue-test.sh
start-feature: ./tests/start-feature-test.sh
review-feature: ./tests/review-feature-test.sh
review-planning: ./tests/review-planning-test.sh
revise-planning: ./tests/revise-planning-test.sh
finish-planning: ./tests/finish-planning-test.sh
finish-feature: ./tests/finish-feature-test.sh
cleanup-worktree: ./tests/cleanup-worktree-test.sh
triage-review: ./tests/triage-review-test.sh
apply-triage: ./tests/apply-triage-test.sh
start-planning: ./tests/start-planning-test.sh
